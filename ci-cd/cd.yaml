# .github/workflows/cd.yml
name: CD

# Deliberately manual. This is a reference implementation, and a push to main
# must never deploy anything on its own. Chapter 11 describes the push trigger
# this would carry in a real service; wire it back up when you have staging and
# production kubeconfigs of your own to point it at.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.auto-sre-graph.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.STAGING_KUBECONFIG }}" > $HOME/.kube/config

      - name: Deploy to staging
        run: |
          kubectl apply -f kubernetes/
          kubectl apply -f kubernetes/secrets.yaml
        
      - name: Rollout status
        run: |
          kubectl rollout status deployment/auto-sre-graph -n sre-automation --timeout=300s

      - name: Verify deployment
        run: |
          sleep 30
          kubectl get pods -n sre-automation
          kubectl logs -l app=auto-sre-graph -n sre-automation --tail=50

      - name: Run smoke tests
        run: |
          curl -f https://staging.auto-sre-graph.example.com/health

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://auto-sre-graph.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.PRODUCTION_KUBECONFIG }}" > $HOME/.kube/config

      - name: Deploy to production
        run: |
          kubectl apply -f kubernetes/
          kubectl apply -f kubernetes/secrets.yaml

      - name: Rollout status
        run: |
          kubectl rollout status deployment/auto-sre-graph -n sre-automation --timeout=300s

      - name: Verify deployment
        run: |
          sleep 30
          kubectl get pods -n sre-automation
          kubectl logs -l app=auto-sre-graph -n sre-automation --tail=50

      - name: Run smoke tests
        run: |
          curl -f https://auto-sre-graph.example.com/health

      - name: Send deployment notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          SLACK_TITLE: 'Production Deployment Successful'
          SLACK_MESSAGE: |
            ✅ Auto-SRE-Graph deployed to production
            Version: ${{ github.sha }}
            Deployed by: ${{ github.actor }}
          SLACK_COLOR: 'good'

  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    if: failure()
    needs: [deploy-staging, deploy-production]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.PRODUCTION_KUBECONFIG }}" > $HOME/.kube/config

      - name: Rollback deployment
        run: |
          kubectl rollout undo deployment/auto-sre-graph -n sre-automation

      - name: Send rollback notification
        uses: rtCamp/action-slack-notify@v2
        if: always()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          SLACK_TITLE: '🚨 Rollback Performed'
          SLACK_MESSAGE: |
            ❌ Auto-SRE-Graph deployment failed
            Rollback initiated by: ${{ github.actor }}
            Failed commit: ${{ github.sha }}
          SLACK_COLOR: 'danger'