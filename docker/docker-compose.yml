# docker/docker-compose.yml
# Auto-SRE-Graph Docker Compose Configuration

services:
  api:
    build:
      context: ..  # Set context to parent directory (project root)
      dockerfile: docker/Dockerfile
    container_name: auto-sre-graph-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-DEV}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-sre_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sre_password}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE:-sre_workflows}
      - NEO4J_HOST=neo4j
      - NEO4J_PORT=7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-neo4j_password}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - LITELLM_HOST=litellm
      - LITELLM_PORT=4000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - JIRA_URL=${JIRA_URL}
      - JIRA_USERNAME=${JIRA_USERNAME}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN}
      - JIRA_WEBHOOK_SECRET=${JIRA_WEBHOOK_SECRET}
      - API_KEY=${API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - WEBHOOK_SIGNING_SECRET=${WEBHOOK_SIGNING_SECRET}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-true}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-Auto-SRE}
    env_file:
      - ../.env  # Changed from ../../.env to ../.env
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
      litellm:
        condition: service_started
    volumes:
      - ../src:/app/src  # Changed from ../../src to ../src
      - ../tests:/app/tests  # Changed from ../../tests to ../tests
      - ../requirements:/app/requirements  # Mount requirements for development
    networks:
      - sre-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: pgvector/pgvector:pg15
    container_name: auto-sre-graph-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sre_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sre_password}
      - POSTGRES_DB=${POSTGRES_DATABASE:-sre_workflows}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations/init.sql:/docker-entrypoint-initdb.d/init.sql  # Changed
    networks:
      - sre-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sre_user} -d ${POSTGRES_DATABASE:-sre_workflows}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  neo4j:
    image: neo4j:5-enterprise
    container_name: auto-sre-graph-neo4j
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j_password}
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - sre-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER:-neo4j}", "-p", "${NEO4J_PASSWORD:-neo4j_password}", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: auto-sre-graph-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - sre-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: auto-sre-graph-redis
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    networks:
      - sre-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: auto-sre-graph-litellm
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sre_user}:${POSTGRES_PASSWORD:-sre_password}@postgres:5432/${POSTGRES_DATABASE:-sre_workflows}
    ports:
      - "4000:4000"
    volumes:
      - ../litellm_config.yaml:/app/config.yaml  # Changed
    command: --config /app/config.yaml --port 4000
    networks:
      - sre-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: auto-sre-graph-otel
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ../otel-collector-config.yaml:/etc/otel-collector-config.yaml  # Changed
    ports:
      - "4318:4318"
      - "4317:4317"
      - "8888:8888"
    networks:
      - sre-network
    restart: unless-stopped

  # Tripwire Log Parser Sidecar
  tripwire:
    build:
      context: ..
      dockerfile: docker/Dockerfile.tripwire
    container_name: auto-sre-graph-tripwire
    environment:
      - TARGET_LOG=/var/log/shared/application.log
      - WEBHOOK_DESTINATION=http://api:8000/webhooks/tripwire
      - ENVIRONMENT=${ENVIRONMENT:-DEV}
      - SERVICE_NAME=${TRIPWIRE_SERVICE_NAME:-legacy-monolith}
    volumes:
      - shared_logs:/var/log/shared:ro
    depends_on:
      - api
    networks:
      - sre-network
    restart: unless-stopped

  # pgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: auto-sre-graph-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@auto-sre-graph.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - sre-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  redis_data:
  pgadmin_data:
  shared_logs:

networks:
  sre-network:
    driver: bridge
    name: auto-sre-graph-network