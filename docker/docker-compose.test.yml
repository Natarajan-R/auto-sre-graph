# docker/docker-compose.test.yml
version: '3.8'

services:
  api:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    environment:
      - ENVIRONMENT=TEST
      - LOG_LEVEL=DEBUG
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_password
      - POSTGRES_DATABASE=test_sre_workflows
      - NEO4J_HOST=neo4j
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4j_password
      - QDRANT_HOST=qdrant
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-test-key}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-sk-test-key}
      - JIRA_URL=https://test-jira.atlassian.net
      - JIRA_USERNAME=test-user
      - JIRA_API_TOKEN=test-token
      - JIRA_WEBHOOK_SECRET=test-secret
      - API_KEY=test-api-key
      - JWT_SECRET=test-jwt-secret
      - WEBHOOK_SIGNING_SECRET=test-signing-secret
    command: python -m pytest /app/tests/ -v --cov=src --cov-report=term --cov-report=html:/app/htmlcov
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ../../src:/app/src
      - ../../tests:/app/tests
      - ../../htmlcov:/app/htmlcov
      - ../../coverage.xml:/app/coverage.xml
    networks:
      - sre-test-network

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_password
      - POSTGRES_DB=test_sre_workflows
    ports:
      - "5433:5432"
    volumes:
      - ../../migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_sre_workflows"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sre-test-network

  neo4j:
    image: neo4j:5-enterprise
    environment:
      - NEO4J_AUTH=neo4j/neo4j_password
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
    ports:
      - "7475:7474"
      - "7688:7687"
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "neo4j_password", "RETURN 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sre-test-network

  qdrant:
    image: qdrant/qdrant:v1.7.0
    ports:
      - "6334:6333"
    networks:
      - sre-test-network

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sre-test-network

networks:
  sre-test-network:
    driver: bridge