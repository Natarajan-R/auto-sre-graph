# kubernetes/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: auto-sre-graph-config
  namespace: sre-automation
  labels:
    app: auto-sre-graph
    component: config
data:
  # Application Configuration
  APP_NAME: "Auto-SRE-Graph"
  APP_VERSION: "1.0.0"
  ENVIRONMENT: "PROD"
  LOG_LEVEL: "INFO"
  
  # API Configuration
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  API_WORKERS: "4"
  API_TIMEOUT: "60"
  
  # Database Configuration
  POSTGRES_HOST: "postgres-sre.default.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DATABASE: "sre_workflows"
  POSTGRES_POOL_SIZE: "10"
  POSTGRES_MAX_OVERFLOW: "20"
  
  # Neo4j Configuration
  NEO4J_HOST: "neo4j-sre.default.svc.cluster.local"
  NEO4J_PORT: "7687"
  NEO4J_DATABASE: "neo4j"
  
  # Qdrant Configuration
  QDRANT_HOST: "qdrant-sre.default.svc.cluster.local"
  QDRANT_PORT: "6333"
  QDRANT_COLLECTION: "runbooks"
  QDRANT_VECTOR_SIZE: "1536"
  
  # LiteLLM Configuration
  LITELLM_HOST: "litellm-sre.default.svc.cluster.local"
  LITELLM_PORT: "4000"
  
  # Jira Configuration
  JIRA_URL: "https://your-domain.atlassian.net"
  JIRA_PROJECT_KEY: "SRE"
  JIRA_ISSUE_TYPE: "Incident"
  
  # Observability
  OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: "auto-sre-graph"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.default.svc.cluster.local:4318"
  OTEL_EXPORTER_OTLP_INSECURE: "true"
  
  # Security
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRE_MINUTES: "60"
  
  # Rate Limiting
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REQUESTS: "100"
  RATE_LIMIT_PERIOD: "60"
  
  # Feature Flags
  FEATURE_ENABLE_AUTO_REMEDIATION: "false"
  FEATURE_ENABLE_LLM_CACHING: "true"
  FEATURE_ENABLE_AUDIT_LOGGING: "true"
  FEATURE_ENABLE_SLA_MONITORING: "true"
  FEATURE_ENABLE_CANARY: "true"
  FEATURE_ENABLE_COST_OPTIMIZATION: "true"
  
  # Timeouts
  CONTEXT_RETRIEVAL_TIMEOUT: "30"
  AGENT_TIMEOUT: "60"
  REMEDIATION_TIMEOUT: "300"
  
  # Embedding Configuration
  EMBEDDING_PROVIDER: "openai"
  EMBEDDING_MODEL: "text-embedding-ada-002"
  EMBEDDING_DIMENSION: "1536"
  EMBEDDING_BATCH_SIZE: "20"
  EMBEDDING_CACHE_ENABLED: "true"
  EMBEDDING_CACHE_SIZE: "10000"
  
  # LLM Configuration
  LLM_PROVIDER: "openai"
  OPENAI_MODEL: "gpt-4"
  ANTHROPIC_MODEL: "claude-3-opus-20240229"
  LLM_TEMPERATURE: "0.1"
  LLM_MAX_TOKENS: "4096"
  LLM_TIMEOUT: "30"
  
  # SLA Configuration
  SLA_RESPONSE_TIME_CRITICAL: "120"
  SLA_RESPONSE_TIME_HIGH: "300"
  SLA_RESPONSE_TIME_MEDIUM: "600"
  SLA_RESOLUTION_TIME_CRITICAL: "1800"
  SLA_RESOLUTION_TIME_HIGH: "3600"
  SLA_RESOLUTION_TIME_MEDIUM: "7200"
  
  # Alert Filtering
  ALLOWED_SERVICES: "auth-service,payment-service,order-service,user-service,notification-service,inventory-service"
  ALLOWED_ENVIRONMENTS: "DEV,SIT,UAT,PROD"
  REQUIRE_STACK_TRACE: "false"