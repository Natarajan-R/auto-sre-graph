# kubernetes/secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: auto-sre-graph-secrets
  namespace: sre-automation
  labels:
    app: auto-sre-graph
    component: secrets
type: Opaque
stringData:
  # Database Credentials
  POSTGRES_USER: "sre_user"
  POSTGRES_PASSWORD: "sre_password_please_change"
  
  # Neo4j Credentials
  NEO4J_USER: "neo4j"
  NEO4J_PASSWORD: "neo4j_password_please_change"
  
  # Qdrant Credentials (if using Qdrant Cloud)
  QDRANT_API_KEY: "your-qdrant-api-key"
  
  # LLM API Keys
  OPENAI_API_KEY: "sk-your-openai-api-key"
  ANTHROPIC_API_KEY: "sk-ant-your-anthropic-api-key"
  AZURE_OPENAI_API_KEY: "your-azure-openai-api-key"
  COHERE_API_KEY: "your-cohere-api-key"
  
  # Jira Credentials
  JIRA_USERNAME: "your-jira-username"
  JIRA_API_TOKEN: "your-jira-api-token"
  JIRA_WEBHOOK_SECRET: "your-jira-webhook-secret"
  
  # Security
  API_KEY: "your-api-key-for-client-auth"
  JWT_SECRET: "your-jwt-secret-key-change-in-production"
  WEBHOOK_SIGNING_SECRET: "your-webhook-signing-secret"
  
  # Observability
  LANGCHAIN_API_KEY: "your-langchain-api-key"
  
  # Redis (if using)
  REDIS_PASSWORD: "redis-password"
  
  # Grafana/OTel
  OTEL_EXPORTER_OTLP_HEADERS: "api-key=your-otel-api-key"
  
---
# PostgreSQL Secret
apiVersion: v1
kind: Secret
metadata:
  name: postgres-sre-secret
  namespace: sre-automation
type: Opaque
stringData:
  username: "sre_user"
  password: "sre_password_please_change"
  host: "postgres-sre.default.svc.cluster.local"
  database: "sre_workflows"
---
# Neo4j Secret
apiVersion: v1
kind: Secret
metadata:
  name: neo4j-sre-secret
  namespace: sre-automation
type: Opaque
stringData:
  username: "neo4j"
  password: "neo4j_password_please_change"
  host: "neo4j-sre.default.svc.cluster.local"
---
# Jira Secret
apiVersion: v1
kind: Secret
metadata:
  name: jira-sre-secret
  namespace: sre-automation
type: Opaque
stringData:
  url: "https://your-domain.atlassian.net"
  username: "your-jira-username"
  api_token: "your-jira-api-token"